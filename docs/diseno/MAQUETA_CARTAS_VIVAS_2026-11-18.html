<!doctype html>
<html lang="es-GT">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Cartas vivas · Leogin</title><link rel="stylesheet" href="cartas-demo/cartas.css"><script src="cartas-demo/cartas.js" defer></script></head>
<body><a href="#carta" class="skip">Ir a la carta</a>
<header class="studio"><div class="bar"><span><b>Leogin</b> <i>/</i> Estudio de cartas</span><label class="select">Ver restaurante <select id="restaurant"><option value="miga">Miga de Oro</option><option value="doble">Doble Fondo</option><option value="mesa">Mesa Larga</option></select></label></div></header>
<main id="main">
<header class="mast"><div><p id="place" class="eyebrow"></p><h1 id="brand"></h1></div><button id="bag" class="lineBtn">Mi pedido</button></header>
<section class="feature" id="feature"><div class="heroText"><p id="edition" class="eyebrow"></p><h2 id="title"></h2><p id="story"></p><div class="offer"><strong id="price"></strong><button class="action" id="discover"></button></div></div><figure><img id="photo" width="623" height="421" alt=""><figcaption id="caption"></figcaption></figure></section>
<section id="carta" tabindex="-1"><div class="sectionTitle"><div><p class="eyebrow" id="sectionKicker"></p><h2 id="sectionName"></h2></div><button id="special" class="lineBtn"></button></div>
<label class="search"><span aria-hidden="true">⌕</span><input id="query" type="search" placeholder="Buscar un platillo…" aria-label="Buscar en la carta en español o inglés"></label>
<div id="list"></div></section>
<details id="lab"><summary>Escenarios de prueba</summary><div class="labControls"><label>Entrada<select id="entry"><option value="general">Enlace general</option><option value="mesa">QR de mesa 4</option><option value="redes">Publicación de la especialidad</option></select></label><label>Estado de la carta<select id="scenario"><option value="normal">Servicio normal</option><option value="sold">Especialidad agotada</option><option value="empty">Carta vacía</option><option value="failure">Fallo de carga</option><option value="large">Carta de 1,001 productos</option></select></label></div></details>
<footer>Demostración local de Leogin · Restaurantes, fotografías y horarios de muestra. Los pedidos son simulados.</footer></main>
<dialog id="sheet" aria-labelledby="dialogTitle"><div class="sheetTop"><span id="sheetBrand"></span><button id="close" aria-label="Cerrar">×</button></div><div id="inside"></div></dialog><p id="notice" role="status" class="sr"></p>
</body></html>
