<!doctype html>
<!-- Pantalla de arranque de Leogin Desktop.
     - Sin panel configurado (primera vez, o tras "Cambiar de cuenta" desde
       el menú Cuenta / la bandeja): un solo botón, iniciar sesión con la
       cuenta de Leogin — la web resuelve sola el restaurante y Rust detecta
       a dónde llegó (on_navigation en main.rs) y lo recuerda. Sin dirección
       que escribir ni que confundir: la cuenta ES la identidad, como
       cualquier app de verdad.
     - Arranques siguientes: muestra "Conectando…" mientras Rust comprueba la
       nube; si no hay internet salta a offline.html (respaldo local). -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leogin</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #0d1017; color: #e7eaf0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  main { max-width: 460px; width: 100%; background: #151a26; border: 1px solid #262d40; border-radius: 18px; padding: 30px; }
  .logo { width: 52px; height: 52px; border-radius: 13px; background: #1c1c1e; display: grid; place-items: center; margin-bottom: 16px; }
  .logo svg { width: 34px; height: 34px; }
  h1 { font-size: 21px; letter-spacing: -0.3px; }
  .sub { font-size: 13.5px; color: #8b93a7; margin-top: 6px; }
  button { width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 11px; cursor: pointer;
           background: linear-gradient(135deg, #e8534a, #f5a030); color: #fff; font: inherit; font-weight: 800; font-size: 15px; }
  button:disabled { opacity: 0.6; cursor: default; }
  .note { margin-top: 18px; padding-top: 16px; border-top: 1px solid #262d40; font-size: 12.5px; color: #8b93a7; display: none; }
  .boot { display: none; margin-top: 24px; align-items: center; gap: 12px; }
  .spin { width: 20px; height: 20px; border: 3px solid #2c3550; border-top-color: #f5a030; border-radius: 99px;
          animation: r 0.8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  .ver { margin-top: 20px; font-size: 11.5px; color: #5b6378; text-align: center; }
  .choice { display: none; }
</style>
</head>
<body>
<main>
  <div class="logo">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="lg" x1="27" y1="19" x2="72" y2="81" gradientUnits="userSpaceOnUse"><stop stop-color="#E8534A"/><stop offset="1" stop-color="#F5A030"/></linearGradient></defs><path d="M27 19 h18 v44 h27 v18 H27 Z" fill="url(#lg)"/></svg>
  </div>
  <h1 id="title">Leogin</h1>
  <div class="sub" id="sub">Preparando…</div>

  <div class="boot" id="boot"><div class="spin"></div><div id="bootmsg">Conectando con tu panel…</div></div>

  <div class="choice" id="choice">
    <button id="loginBtn" type="button">Iniciar sesión con tu cuenta de Leogin</button>
    <div class="note" id="note">
      ¿Esta PC va a <b>imprimir</b> y a mantener el restaurante <b>funcionando sin internet</b>?
      Después de entrar, hazlo desde tu panel en <b>Impresión → Hacer de esta PC el servidor del local</b>
      (solo se necesita en una PC del local).
    </div>
  </div>

  <div class="ver" id="ver"></div>
</main>

<script>
  const invoke = window.__TAURI__.core.invoke;
  const $ = (id) => document.getElementById(id);

  async function start() {
    const info = await invoke('get_setup_info');
    $('ver').textContent = 'Leogin para escritorio v' + info.appVersion;

    // ?setup=1 (menú "Cuenta" o bandeja → "Cambiar dirección del panel"):
    // misma pantalla que el primer arranque — conectar esta PC con un
    // restaurante es siempre "inicia sesión", sea la primera vez o para
    // cambiarlo.
    const forceSetup = new URLSearchParams(location.search).has('setup');
    if (forceSetup) {
      $('sub').textContent = info.panelUrl
        ? 'Cambia de cuenta o conecta esta PC con otro restaurante.'
        : 'Conecta esta PC con tu restaurante.';
      $('choice').style.display = 'block';
      $('note').style.display = 'block';
      return;
    }

    if (info.panelUrl) {
      $('sub').textContent = info.panelUrl.replace(/^https?:\/\//, '');
      $('boot').style.display = 'flex';
      const dest = await invoke('boot');          // navega al panel si hay nube
      if (dest === 'offline') location.replace('offline.html');
      return;
    }

    $('sub').textContent = 'Conecta esta PC con tu restaurante.';
    $('choice').style.display = 'block';
    $('note').style.display = 'block';
  }

  $('loginBtn').addEventListener('click', async () => {
    // begin_relink olvida (solo en memoria) el panel_url anterior si lo
    // había, para que al volver ya autenticado se adopte el restaurante
    // nuevo en vez de quedarse pegado al de antes — ver comentario del
    // comando en main.rs. Sin efecto en el primer arranque (no hay nada que
    // olvidar).
    $('loginBtn').disabled = true;
    location.href = await invoke('begin_relink');
  });

  start();
</script>
</body>
</html>
