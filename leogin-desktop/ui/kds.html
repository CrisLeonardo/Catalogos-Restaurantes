<!doctype html>
<!-- Modo kiosco (--kds): pantalla dedicada de cocina. Busca el hub local de
     esta PC (LeoginAgent) y navega directo a su KDS de respaldo en cuanto
     responde — sin bandeja, sin setup, sin toast de actualización. Si el hub
     tarda en arrancar (la PC recién encendió), reintenta solo. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leogin — Cocina</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: #0d1017; color: #e7eaf0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: grid; place-items: center; }
  main { text-align: center; }
  .logo { width: 64px; height: 64px; border-radius: 16px; background: #C2542F; display: grid; place-items: center;
          margin: 0 auto 20px; }
  .logo svg { width: 47px; height: 47px; }
  h1 { font-size: 22px; letter-spacing: -0.3px; }
  .sub { font-size: 14px; color: #8b93a7; margin-top: 8px; }
  .spin { width: 24px; height: 24px; border: 3px solid #2c3550; border-top-color: #f5a030; border-radius: 99px;
          margin: 22px auto 0; animation: r 0.8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <div class="logo">
    <svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill-rule="evenodd" d="M10 0H90Q100 0 100 10V100L91.67 110L83.33 100L75 110L66.67 100L58.33 110L50 100L41.67 110L33.33 100L25 110L16.67 100L8.33 110L0 100V10Q0 0 10 0ZM30 22H41Q44 22 44 25V61H70Q73 61 73 64V75Q73 78 70 78H30Q27 78 27 75V25Q27 22 30 22ZM50 44a11 11 0 1 0 22 0a11 11 0 1 0 -22 0Z" fill="#F2F1EE"/></svg>
  </div>
  <h1>Leogin — Cocina</h1>
  <div class="sub" id="sub">Buscando el hub local de esta PC…</div>
  <div class="spin"></div>
</main>

<script>
  const invoke = window.__TAURI__.core.invoke;

  async function tryConnect() {
    try {
      const url = await invoke('get_kds_url');
      if (url) {
        document.getElementById('sub').textContent = 'Conectado — abriendo la pantalla de cocina…';
        location.href = url;
        return;
      }
    } catch { /* se reintenta */ }
    setTimeout(tryConnect, 2500);
  }

  tryConnect();
</script>
</body>
</html>
