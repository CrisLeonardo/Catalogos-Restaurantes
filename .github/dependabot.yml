# Dependabot (SEG-05 de docs/auditorias/AUDITORIA_SALIDA_PRODUCCION_2026-10-09.md).
#
# Antes nadie avisaba de una dependencia vulnerable: Next.js llegó a la
# auditoría con una vulnerabilidad crítica y sharp con varias altas sin que
# nada lo señalara. Ahora Dependabot revisa cada semana y abre PR propios
# (rama `dependabot/...`), que pasan por la misma CI que cualquier otro.
#
# Las versiones menores y de parche se agrupan en UN PR por carpeta para no
# llenar la lista; las mayores NUNCA entran en ese grupo (`update-types`
# solo minor/patch, también en las acciones) y llegan sueltas porque cada
# una se revisa aparte (notas de versión, cambios incompatibles). Los
# avisos de seguridad abren su PR en cuanto se publican, sin esperar al lunes.
#
# Mayores ignoradas hasta decidir migrarlas a propósito (2026-10-11): zod 4,
# TypeScript 7, vitest 5 y @types/node por encima del Node que corre en
# producción. Traen cambios incompatibles y Dependabot abría un PR por cada
# una cada semana. El `ignore` solo cubre `version-update:semver-major`: las
# menores y los parches de esos paquetes siguen llegando, y los avisos de
# seguridad no se ven afectados. Para migrar una, quita su línea aquí y haz
# la migración en su propia rama.

version: 2
updates:
  - package-ecosystem: npm
    directory: /plataforma
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Guatemala
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      menores:
        update-types: [minor, patch]
    ignore:
      - dependency-name: zod
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /agente-impresion
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Guatemala
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps-agente)"
    groups:
      menores:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /leogin-desktop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Guatemala
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps-desktop)"
    groups:
      menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Guatemala
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      acciones:
        patterns: ["*"]
        update-types: [minor, patch]
