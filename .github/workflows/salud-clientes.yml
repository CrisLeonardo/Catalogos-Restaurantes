# ============================================================
#  Salud de los clientes — reloj externo (MON-04)
#  ------------------------------------------------------------
#  /api/cron/salud-clientes revisa todos los restaurantes y manda al
#  celular del Super Admin lo GRAVE: la PC del local caída en horario de
#  servicio o muchas comandas sin imprimir (lib/client-health.ts). No
#  repite el mismo aviso antes de 6 h.
#
#  Mismo patrón que la cola FEL (fel-cola.yml): gratis, el repositorio ya
#  usa Actions, y el endpoint no sabe quién lo llama — un cron de Render o
#  un monitor externo servirían igual.
#
#  Cada HORA y no más seguido: el repositorio es privado y los minutos de
#  Actions se cuentan (cada corrida gasta 1). Cada hora son ~720 al mes.
#
#  Configurar antes de que sirva de algo (Settings → Secrets → Actions):
#    SALUD_CRON_URL     https://distleogin.com/api/cron/salud-clientes
#    SALUD_CRON_SECRET  el mismo valor que la variable SALUD_CRON_SECRET de Render
#
#  Sin esos secretos el trabajo termina sin hacer nada y lo dice, en vez de
#  fallar cada hora y llenar el historial de rojo.
# ============================================================

name: Salud de los clientes

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: salud-clientes
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Revisar y avisar
        env:
          URL: ${{ secrets.SALUD_CRON_URL }}
          SECRET: ${{ secrets.SALUD_CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "SALUD_CRON_URL o SALUD_CRON_SECRET no están configurados: no hay nada que hacer."
            exit 0
          fi

          codigo=$(curl -sS -o respuesta.json -w '%{http_code}' \
            --max-time 60 \
            -X POST "$URL" \
            -H "Authorization: Bearer $SECRET")

          echo "HTTP $codigo"
          cat respuesta.json
          echo

          if [ "$codigo" != "200" ]; then
            echo "::error::Salud de los clientes respondió $codigo"
            exit 1
          fi
