<!doctype html>
<!-- Respaldo sin nube. La ventana cae aquí cuando el panel alojado no
     responde. Muestra el estado del hub local (LeoginAgent) y regresa sola
     al panel en cuanto vuelve la conexión. El hub sigue capturando pedidos
     e imprimiendo por su cuenta — esta página solo informa y da accesos. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leogin — sin conexión</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #0d1017; color: #e7eaf0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  main { max-width: 470px; width: 100%; background: #151a26; border: 1px solid #262d40; border-radius: 18px; padding: 30px; }
  h1 { font-size: 20px; display: flex; align-items: center; gap: 10px; letter-spacing: -0.3px; }
  .dot { width: 11px; height: 11px; border-radius: 99px; background: #eab308; box-shadow: 0 0 10px #eab308; flex: none; }
  p { font-size: 13.5px; color: #aab2c5; margin-top: 12px; }
  .hub { margin-top: 18px; padding: 14px 16px; border-radius: 12px; border: 1px solid #262d40; background: #0f1420;
         font-size: 13.5px; display: flex; align-items: center; gap: 10px; }
  .hub .st { width: 9px; height: 9px; border-radius: 99px; flex: none; }
  .links { display: flex; flex-direction: column; gap: 9px; margin-top: 18px; }
  button { padding: 12px; border: 0; border-radius: 11px; cursor: pointer; font: inherit; font-weight: 800; font-size: 14px; }
  .pri { background: linear-gradient(135deg, #e8534a, #f5a030); color: #fff; }
  .sec { background: #233049; color: #e7eaf0; }
  .ghost { background: transparent; border: 1px solid #262d40; color: #aab2c5; font-weight: 600; }
  .retry { margin-top: 16px; font-size: 12.5px; color: #5b6378; display: flex; align-items: center; gap: 8px; }
  .spin { width: 13px; height: 13px; border: 2px solid #2c3550; border-top-color: #f5a030; border-radius: 99px;
          animation: r 0.8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <h1><span class="dot"></span> Sin conexión con la nube</h1>
  <p>No se pudo abrir tu panel. En cuanto vuelva el internet, Leogin regresa solo
     a tu panel — deja esta ventana abierta.</p>

  <div class="hub" id="hub">
    <span class="st" style="background:#5b6378"></span>
    <span>Buscando el hub local de este restaurante…</span>
  </div>

  <div class="links">
    <button class="pri" id="retry">Reintentar ahora</button>
    <button class="sec" id="hubpage" style="display:none">Abrir el modo local (hub de esta red)</button>
    <button class="ghost" id="tryweb">Intentar abrir el panel de todos modos</button>
  </div>

  <div class="retry"><div class="spin"></div> Reintentando automáticamente…</div>
</main>

<script>
  const invoke = window.__TAURI__.core.invoke;
  const $ = (id) => document.getElementById(id);

  async function paintHub() {
    try {
      const hub = await invoke('hub_status');
      const st = $('hub').querySelector('.st');
      if (hub && hub.ok) {
        st.style.background = '#4ade80';
        st.style.boxShadow = '0 0 8px #4ade80';
        $('hub').lastElementChild.innerHTML =
          `<b>Hub local activo</b> (v${hub.version}) — los pedidos y la impresión siguen funcionando en tu red.`;
        $('hubpage').style.display = 'block';
      } else {
        st.style.background = '#ef4444';
        $('hub').lastElementChild.textContent =
          'No hay hub local en esta PC. Si otra PC del local lo tiene instalado, los pedidos siguen cubiertos desde allá.';
      }
    } catch { /* se reintenta en el próximo ciclo */ }
  }

  async function tryCloud() {
    try {
      if (await invoke('check_cloud')) await invoke('open_panel');
    } catch { /* sin nube todavía */ }
  }

  $('retry').addEventListener('click', tryCloud);
  $('tryweb').addEventListener('click', () => invoke('open_panel'));
  $('hubpage').addEventListener('click', () => invoke('open_hub_page'));

  paintHub();
  tryCloud();
  setInterval(tryCloud, 6000);
  setInterval(paintHub, 15000);
</script>
</body>
</html>
