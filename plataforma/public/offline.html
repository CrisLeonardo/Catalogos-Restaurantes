<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sin conexión</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #0b0b0c;
    color: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  main {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    gap: 16px;
  }
  h1 { font-size: 20px; margin: 0; }
  p { font-size: 14px; color: #a1a1aa; margin: 0; max-width: 320px; line-height: 1.5; }
  button {
    margin-top: 8px;
    padding: 12px 24px;
    border-radius: 12px;
    border: none;
    background: #f5f5f7;
    color: #0b0b0c;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>
  <main>
    <h1>Sin conexión</h1>
    <p>No se pudo cargar esta página. Revisa tu conexión e intenta de nuevo — si ya visitaste el menú antes, algunas páginas siguen disponibles.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
